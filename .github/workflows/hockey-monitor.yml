name: Hockey Shadow Monitor
on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: hockey-shadow-state
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main' && vars.HOCKEY_MONITOR_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install cryptography==46.0.3
      - run: python -m unittest discover -v
      - run: python hockey_monitor.py
        env:
          BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
          HOCKEY_STATE_SECRET: ${{ secrets.HOCKEY_STATE_SECRET }}
      - name: Persist encrypted state
        if: always()
        run: |
          if [ -f hockey_state.enc ]; then
            git config user.name github-actions
            git config user.email github-actions@github.com
            git add -f hockey_state.enc
            git diff --cached --quiet || git commit -m "Update encrypted hockey state"
            git push origin HEAD:main
          fi
