name: Hockey API Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      BIGBALLS_API_KEY: ${{ secrets.BIGBALLS_API_KEY }}
      MOVIODDS_API_KEY: ${{ secrets.MOVIODDS_API_KEY }}
    steps:
      - name: Inspect provider schemas without secrets
        run: |
          python - <<'PY'
          import os,json,urllib.request,urllib.error
          from datetime import datetime,timezone,timedelta
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,*args,**kwargs): return None
          def get(label,url,key,header):
              if not key:
                  print(label,"missing key"); return {}
              try:
                  with urllib.request.build_opener(NoRedirect()).open(urllib.request.Request(url,headers={header:key,"Accept":"application/json"}),timeout=25) as r:
                      print(label,"HTTP",r.status)
                      for k,v in r.headers.items():
                          if "ratelimit" in k.lower() and v.isdigit(): print(k,v)
                      data=json.load(r)
                      print(label,"root",sorted(data) if isinstance(data,dict) else type(data).__name__)
                      return data if isinstance(data,dict) else {}
              except urllib.error.HTTPError as e: print(label,"HTTP",e.code)
              except (OSError,ValueError): print(label,"unavailable")
              return {}
          day=(datetime.now(timezone.utc)-timedelta(days=2)).date().isoformat()
          a=get("NHL","https://api.bigballsdata.com/v1/matches?sport=ice_hockey&league=nhl&date="+day+"&limit=50",os.getenv("BIGBALLS_API_KEY"),"x-api-key")
          rows=a.get("data") or []
          if isinstance(rows,list):
              print("NHL rows",len(rows))
              for m in rows[:10]:
                  if isinstance(m,dict):
                      print("Fields",sorted(m))
                      print("Sample",json.dumps({k:m.get(k) for k in ("status","score","linescore","home","away","kickoff_utc")}))
          b=get("Odds","https://moviodds.com/odds?sport=ice_hockey",os.getenv("MOVIODDS_API_KEY"),"X-API-Key")
          rows=b.get("matches") or []
          if isinstance(rows,list):
              print("Odds rows",len(rows))
              groups={}
              for m in rows:
                  if not isinstance(m,dict): continue
                  for q in m.get("quotes") or []:
                      if isinstance(q,dict):
                          n=str(q.get("group_name"))[:100]
                          groups[n]=groups.get(n,0)+1
              print("Markets",json.dumps(groups))
              if rows and isinstance(rows[0],dict):
                  print("Odds fields",sorted(rows[0]))
                  for m in rows:
                      if m.get("in_play") is False and "nhl" in str(m.get("league","")).lower():
                          print("NHL odds sample",json.dumps({k:m.get(k) for k in ("home","away","league","kickoff_utc","polled_at","stale")}))
                          for q in m.get("quotes") or []:
                              if q.get("group_name") in ("Game","3-Way"):
                                  print("Market sample",json.dumps({k:q.get(k) for k in ("group_name","group_id","market_id","side","line","phase","suspended","odds_dec","ts")}))
                          break
          PY
