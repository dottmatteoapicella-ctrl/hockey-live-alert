name: NHL Public Data Probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - run: |
          python - <<'PY'
          import json,urllib.request
          from datetime import datetime,timezone,timedelta
          def get(path):
              with urllib.request.urlopen("https://api-web.nhle.com/v1/"+path,timeout=25) as r:
                  print("HTTP",r.status)
                  return json.load(r)
          day=(datetime.now(timezone.utc)-timedelta(days=2)).date().isoformat()
          data=get("score/"+day)
          games=data.get("games",[])
          print("Games",len(games))
          final=next((g for g in games if g.get("gameState") in ("OFF","FINAL")),None)
          if final:
              print("Scoreboard",json.dumps({k:final.get(k) for k in ("id","gameState","periodDescriptor","gameOutcome","homeTeam","awayTeam")}))
              box=get("gamecenter/"+str(int(final["id"]))+"/landing")
              print("Landing keys",sorted(box))
              summary=box.get("summary",{})
              print("Summary keys",sorted(summary))
              print("Scoring",json.dumps([{"periodDescriptor":p.get("periodDescriptor"),"goals":[{"teamAbbrev":g.get("teamAbbrev"),"homeScore":g.get("homeScore"),"awayScore":g.get("awayScore")} for g in p.get("goals",[])]} for p in summary.get("scoring",[])]))
          PY
